<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hifazat — Reviewer Login</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: #e2e8f0;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: -0.5px;
        }

        .logo p {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 15px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        input::placeholder {
            color: #475569;
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            margin-top: 8px;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .error-msg.visible { display: block; }

        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #475569;
        }

        @media (max-width: 480px) {
            .login-card { margin: 16px; padding: 32px 24px; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <h1>🛡️ Hifazat</h1>
            <p>Reviewer Dashboard Login</p>
        </div>

        <div id="error" class="error-msg"></div>

        <form id="loginForm" method="POST" action="/login">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       placeholder="Enter your username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Enter your password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <p class="footer-note">Protected internal tool · Session expires on restart</p>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorDiv = document.getElementById('error');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.classList.remove('visible');

            const formData = new FormData(form);

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    body: new URLSearchParams(formData),
                    redirect: 'manual',
                });

                if (res.type === 'opaqueredirect' || res.status === 303) {
                    window.location.href = '/dashboard';
                    return;
                }

                if (res.status === 401) {
                    errorDiv.textContent = 'Invalid username or password.';
                    errorDiv.classList.add('visible');
                    return;
                }

                const data = await res.json().catch(() => null);
                errorDiv.textContent = data?.detail || 'Login failed. Please try again.';
                errorDiv.classList.add('visible');
            } catch (err) {
                errorDiv.textContent = 'Connection error. Please try again.';
                errorDiv.classList.add('visible');
            }
        });

        // Show error from URL param (e.g., ?error=session_expired)
        const urlErr = new URLSearchParams(window.location.search).get('error');
        if (urlErr) {
            errorDiv.textContent = urlErr === 'session_expired'
                ? 'Session expired. Please log in again.'
                : urlErr;
            errorDiv.classList.add('visible');
        }
    </script>
</body>
</html>
